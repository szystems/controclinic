server {
    listen 80;
    server_name controclinic.com www.controclinic.com;
    root /var/www/html/public;
    index index.php index.html;
    server_tokens off;

    charset utf-8;
    client_max_body_size 25M;

    # Hidden files before PHP, so a dotfile is never executed.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Public uploads. ^~ wins over the PHP regex so a script cannot run from storage.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;

        location ~ \.php$ {
            return 404;
        }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        try_files $uri =404;
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $upstream_php "controclinic-app:9000";
        fastcgi_pass $upstream_php;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }
}
